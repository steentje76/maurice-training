name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exacte commit-SHA om te bouwen (leeg = de gedispatchte ref)'
        required: false
        default: ''
      publish_prerelease:
        description: 'APK ook als pre-release asset publiceren (directe .apk-download)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - 'feature/android-debug-apk'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_sha: ${{ steps.provenance.outputs.build_sha }}
      apk_name: ${{ steps.provenance.outputs.apk_name }}
      app_ver: ${{ steps.provenance.outputs.app_ver }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android assets
        run: npm run cap:sync

      - name: Verify native BLE transport and permissions
        run: |
          test -f android/app/src/main/assets/public/native-transport.js
          grep -q "@capacitor-community/bluetooth-le" android/capacitor.settings.gradle
          grep -q "android.permission.BLUETOOTH_SCAN" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.BLUETOOTH_CONNECT" android/app/src/main/AndroidManifest.xml

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Record provenance and SHA-256
        id: provenance
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          git rev-parse HEAD > android-debug-apk-commit.txt
          sha256sum "$APK" > app-debug.apk.sha256
          cat android-debug-apk-commit.txt
          cat app-debug.apk.sha256
          # Traceerbare bestandsnaam: Trainingskompas-<APP_VER>-<shortSHA>-debug.apk
          BUILD_SHA="$(git rev-parse HEAD)"
          APP_VER="$(grep -oE "const APP_VER = 'v[0-9.]+'" index.html | grep -oE "v[0-9.]+" | head -n1)"
          test -n "$APP_VER"
          APK_NAME="Trainingskompas-${APP_VER}-${BUILD_SHA:0:9}-debug.apk"
          mkdir -p dist
          cp "$APK" "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          cp android-debug-apk-commit.txt dist/
          echo "build_sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_ver=${APP_VER}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainingskompas-android-debug-${{ steps.provenance.outputs.build_sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            android-debug-apk-commit.txt
            dist/
          if-no-files-found: error
          retention-days: 7

  # Optioneel en alleen bij handmatige dispatch: publiceert de zojuist gebouwde debug-APK
  # als pre-release asset, zodat de .apk direct (ook vanaf een telefoon) te downloaden is
  # zonder Actions-artifact-zip. De build-job zelf houdt contents: read; alleen deze job
  # krijgt contents: write. De tag wijst naar exact de gebouwde commit.
  publish-prerelease:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    needs: build-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: trainingskompas-android-debug-${{ needs.build-debug-apk.outputs.build_sha }}
          path: artifact

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build-debug-apk.outputs.build_sha }}
          APK_NAME: ${{ needs.build-debug-apk.outputs.apk_name }}
          APP_VER: ${{ needs.build-debug-apk.outputs.app_ver }}
        run: |
          TAG="apk-debug-${APP_VER}-${BUILD_SHA:0:9}-run${GITHUB_RUN_NUMBER}"
          test -f "artifact/dist/${APK_NAME}"
          gh release create "$TAG" \
            "artifact/dist/${APK_NAME}" \
            "artifact/dist/${APK_NAME}.sha256" \
            "artifact/dist/android-debug-apk-commit.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --prerelease \
            --title "Android debug APK ${APP_VER} (${BUILD_SHA:0:9})" \
            --notes "Debug-APK (niet voor Google Play). Bron-commit: ${BUILD_SHA}. Workflow-run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
