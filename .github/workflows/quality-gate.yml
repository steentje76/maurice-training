name: Trainingskompas Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Core coaching regression tests
        run: node coaching.test.js

      - name: Native Concept2 transport tests
        run: npm run test:native

      - name: Build web assets
        run: npm run build:www

      - name: Verify generated web bundle exists
        run: test -f www/index.html

      - name: Verify critical repository files
        run: |
          test -f docs/DEVELOPMENT_CONTRACT.md
          test -f netlify.toml
          test -f index.html
          test -f coaching.js
          test -f coaching.test.js

      - name: Quality gate summary
        run: |
          echo "Trainingskompas Quality Gate: PASS"
          echo "Commit: $GITHUB_SHA"
