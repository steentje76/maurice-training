name: UX Lab Contract Gate
on:
  pull_request:
    paths:
      - 'docs/ux-lab/**'
      - '.github/workflows/ux-lab-contract-gate.yml'
permissions:
  contents: read
jobs:
  ux-lab-contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validation engine unit tests
        run: node docs/ux-lab/validation-engine.test.js
      - name: Contract exporter unit tests
        run: node docs/ux-lab/contract-exporter.test.js
      - name: End-to-end freeze contract drift gate
        run: node docs/ux-lab/e2e-contract.test.js
      - name: Mobile governance UI gate
        run: node docs/ux-lab/mobile-governance-ui.test.js
      - name: UX Lab workbench UI gate
        run: node docs/ux-lab/workbench-ui.test.js
      - name: Evidence explorer UI gate
        run: node docs/ux-lab/evidence-explorer-ui.test.js
      - name: Source health and state explorer UI gate
        run: node docs/ux-lab/source-health-state-ui.test.js
      - name: Primary screen catalog UI gate
        run: node docs/ux-lab/primary-catalog-ui.test.js
      - name: Multiflow canvas UI gate
        run: node docs/ux-lab/multiflow-canvas-ui.test.js
      - name: Source-backed primary canvas UI gate
        run: node docs/ux-lab/source-backed-canvas-ui.test.js
      - name: Inzicht source-backed drill-down UI gate
        run: node docs/ux-lab/insight-drilldown-ui.test.js
      - name: Profiel canonical drill-down UI gate
        run: node docs/ux-lab/profile-drilldown-ui.test.js
      - name: Capability maturity status UI gate
        run: node docs/ux-lab/capability-status-ui.test.js
      - name: Canonical source blob pin gate
        run: node docs/ux-lab/source-pin-ci.test.js
      - name: Source health semantics UI gate
        run: node docs/ux-lab/source-health-semantics-ui.test.js
