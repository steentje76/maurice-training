apply plugin: 'com.android.application'

// RC0 — ONDERTEKENING VOOR DE RELEASE.
// De release-buildtype had geen signingConfig, dus `bundleRelease` leverde een
// ONGETEKEND artefact op dat Google Play niet accepteert. De sleutel zelf hoort niet in
// Git: deze configuratie leest hem uit android/keystore.properties (staat in .gitignore)
// of, voor een CI-omgeving, uit omgevingsvariabelen. Ontbreken beide, dan blijft de
// release-build gewoon werken zonder ondertekening — zo blijft een debug- of
// controlebuild mogelijk zonder sleutel, terwijl een echte release er wel om vraagt.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def ksStore = keystoreProperties['storeFile'] ?: System.getenv('TK_KEYSTORE_FILE')
def ksStorePass = keystoreProperties['storePassword'] ?: System.getenv('TK_KEYSTORE_PASSWORD')
def ksAlias = keystoreProperties['keyAlias'] ?: System.getenv('TK_KEY_ALIAS')
def ksKeyPass = keystoreProperties['keyPassword'] ?: System.getenv('TK_KEY_PASSWORD')
def heeftSleutel = ksStore != null && ksStorePass != null && ksAlias != null && ksKeyPass != null


android {
    namespace "com.trainingskompas.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.trainingskompas.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // RC0: liep uit de pas met de app zelf (die meldde v4.47.0 in het scherm 'Over').
        // Schema: versionCode = major*10000 + minor*100 + patch, zodat elke release
        // aantoonbaar oploopt en één op één te herleiden is tot versionName.
        versionCode 47027
        versionName "4.70.27"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (heeftSleutel) {
                storeFile file(ksStore)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }
    buildTypes {
        // Isolated test variants: own applicationId (installs next to the production app),
        // debug-signed by the CI runner, never a release artefact. The 25-okt block stood in
        // signingConfigs (invalid there: SigningConfig has no applicationIdSuffix) and is
        // restored as the buildType its workflow (assembleGebruikerstest) expects.
        gebruikerstest {
            initWith debug
            applicationIdSuffix ".gebruikerstest20261025"
            versionNameSuffix "-gebruikerstest20261025"
            matchingFallbacks = ['debug']
        }
        // TK #587 x MoveKit integration test candidate (7 november 2026).
        tk587test {
            initWith debug
            applicationIdSuffix ".tk587test20261107"
            versionNameSuffix "-tk587test20261107"
            matchingFallbacks = ['debug']
        }
        // Integration test candidate 14 november 2026: #612 (#587 fixes) + main incl. one secure
        // V2 media route for all 582 (#628). Own applicationId, installs next to every other app.
        tktest1114 {
            initWith debug
            applicationIdSuffix ".tktest20261114"
            versionNameSuffix "-tktest20261114"
            matchingFallbacks = ['debug']
        }
        tk584test {
            initWith debug
            applicationIdSuffix ".tk584test20261101"
            versionNameSuffix "-tk584test20261101"
            matchingFallbacks = ['debug']
        }
        release {
            // Bewust GEEN debug-ondertekening als terugval: een debug-getekend artefact
            // mag nooit per ongeluk als release de deur uit.
            if (heeftSleutel) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle('[Trainingskompas] Geen keystore gevonden — de release-build wordt NIET ondertekend en is niet uploadbaar naar Google Play. Zie PLAY_STORE_READINESS.md.')
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ANDROID-BARCODE-SCANNER-opdracht: native CameraX + Google ML Kit
    // Barcode Scanning (sectie 2/5) -- uitsluitend officiële, publieke
    // Google-dependencies, geen reverse-engineered/proprietary code.
    def cameraxVersion = "1.3.4"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
