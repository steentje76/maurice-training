[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[functions."cleanup-unverified-accounts"]
  schedule = "@daily"

# MS-TELEMETRY-01: 90 dagen retentie voor ruwe product_telemetry_events.
[functions."cleanup-product-telemetry"]
  schedule = "@daily"

# MS-BETA-01: 365 dagen retentie voor beta_feedback.
[functions."cleanup-beta-feedback"]
  schedule = "@daily"
