<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Terug naar Trainingskompas</title>
<!--
  Terugkeerpagina voor de Android-app (v4.70.25, DEC-API-001).
  De wearable-toestemming loopt in de systeembrowser; de callback stuurt een app-gebruiker
  hierheen (wearable-auth-callback.js, state eindigt op ~android). Deze pagina toont alleen
  de uitkomst en verwijst terug naar de app. Ze ontvangt geen tokens en geen gebruikers-id;
  de enige parameter is een statuswoord uit een vaste lijst. De app haalt de koppelstand
  zelf op zodra ze weer op de voorgrond komt.
-->
<style>
:root{--tekst:#0B1D2A;--zacht:#5a6b78;--lijn:#dde4e9;--vlak:#E6EBEF;--kaart:#fff;--knop:#0B1D2A;--knoptekst:#fff}
@media (prefers-color-scheme: dark){:root{--tekst:#E6EBEF;--zacht:#9fb4bd;--lijn:#1b4353;--vlak:#0B1D2A;--kaart:#0E3B4A;--knop:#E6EBEF;--knoptekst:#0B1D2A}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--vlak);color:var(--tekst);display:flex;align-items:center;justify-content:center;padding:24px 16px;
     font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{width:100%;max-width:420px;background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;padding:28px 22px;text-align:center}
h1{font-size:21px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 18px;color:var(--zacht);font-size:15px}
a.knop{display:block;background:var(--knop);color:var(--knoptekst);text-decoration:none;font-weight:700;border-radius:10px;padding:14px 16px;min-height:48px}
a.knop:focus-visible{outline:3px solid #0E7C86;outline-offset:3px}
small{display:block;margin-top:14px;color:var(--zacht);font-size:13px}
</style>
</head>
<body>
<main>
  <h1 id="titel">Terug naar de app</h1>
  <p id="tekst">Open de Trainingskompas-app om verder te gaan.</p>
  <a class="knop" id="terug" href="trainingskompas://wearable">Terug naar Trainingskompas</a>
  <small>Werkt de knop niet? Open de Trainingskompas-app zelf; de koppeling wordt daar bijgewerkt.</small>
</main>
<script>
(function(){
  // Vaste lijst: de parameter wordt alleen als sleutel gebruikt, nooit in de pagina gezet.
  var TEKST={
    connected:['Koppeling gelukt','Je wearable is gekoppeld. Ga terug naar de app; je gegevens worden daar opgehaald.'],
    denied:['Koppelen geannuleerd','Er is geen toestemming gegeven. Je kunt het in de app opnieuw proberen.'],
    expired:['Koppelpoging verlopen','Start het koppelen opnieuw vanuit de app.'],
    token_error:['Koppelen is niet gelukt','De toestemming kon niet worden verwerkt. Probeer het in de app opnieuw.'],
    save_error:['Koppelen is niet gelukt','De koppeling kon niet veilig worden opgeslagen. Een bestaande koppeling is ongewijzigd. Probeer het in de app opnieuw.'],
    config_error:['Koppelen is nu niet beschikbaar','Deze koppeling is nog niet ingericht.'],
    server_error:['Koppelen is niet gelukt','Er ging iets mis op de server. Probeer het later opnieuw.'],
    invalid_request:['Ongeldig koppelverzoek','Start het koppelen opnieuw vanuit de app.']
  };
  var w=null;
  try{ w=new URLSearchParams(window.location.search).get('wearable'); }catch(_){}
  var t=Object.prototype.hasOwnProperty.call(TEKST,w)?TEKST[w]:null;
  if(!t)return;
  document.getElementById('titel').textContent=t[0];
  document.getElementById('tekst').textContent=t[1];
  document.getElementById('terug').setAttribute('href','trainingskompas://wearable?status='+w);
})();
</script>
</body>
</html>
